name: Sync README to PyPI

# PyPI only reads README.md when a new version is uploaded, so a README change
# bumps the patch version and publishes again.

on:
  push:
    branches: [main]
    paths: ["README.md"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump the patch version
        id: bump
        run: |
          python - <<'PY'
          import os, pathlib, re

          new = None
          for name in ("pyproject.toml", "src/essayist/__init__.py"):
              path = pathlib.Path(name)
              text = path.read_text()
              match = re.search(r'(\d+)\.(\d+)\.(\d+)', text)
              new = "{}.{}.{}".format(
                  match.group(1), match.group(2), int(match.group(3)) + 1
              )
              path.write_text(
                  text[:match.start()] + new + text[match.end():]
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + new + "\n")
          print("new version:", new)
          PY

      - name: Save the new version
        run: |
          git config user.name "martin"
          git config user.email ""
          git add pyproject.toml src/essayist/__init__.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
