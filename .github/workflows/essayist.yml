name: Publish to PyPI

# Publish when a version tag is pushed, or when README.md changes on main.
# PyPI only reads README.md at upload time, so a README change bumps the patch
# version and publishes again.
#
# PyPI's trusted publisher is registered for this file name. Do not rename it.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump the patch version when README.md changed
        id: bump
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "$before" "$after" || true)
          else
            changed=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if ! echo "$changed" | grep -qx README.md; then
            echo "README.md did not change, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib, re

          new = None
          for name in ("pyproject.toml", "src/essayist/__init__.py"):
              path = pathlib.Path(name)
              text = path.read_text()
              match = re.search(r"(\d+)\.(\d+)\.(\d+)", text)
              new = "{}.{}.{}".format(
                  match.group(1), match.group(2), int(match.group(3)) + 1
              )
              path.write_text(text[: match.start()] + new + text[match.end() :])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + new + "\n")
          print("new version:", new)
          PY
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          git config user.name "martin"
          git config user.email ""
          git add pyproject.toml src/essayist/__init__.py
          git commit -m "chore: bump version to $version"
          git push origin HEAD:main
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'workflow_dispatch'
          || steps.bump.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
