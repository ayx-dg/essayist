<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="" xml:lang="">
<head>
  <meta charset="utf-8" />
  <meta name="generator" content="pandoc" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="./style-note.css">
  <style>
    html { color: #1a1a1a; background-color: #fdfdfd; }
    body {
      margin: 0 auto; max-width: 36em; padding: 50px; hyphens: auto;
      overflow-wrap: break-word; text-rendering: optimizeLegibility;
      font-kerning: normal;
    }
    @media (max-width: 600px) { body { font-size: 0.9em; padding: 12px; } }
    a { color: #0055aa; }
    img { max-width: 100%; }
    code { font-family: Menlo, Monaco, Consolas, monospace; font-size: 85%; }
    pre { margin: 1em 0; overflow: auto; }
    table { margin: 1em 0; border-collapse: collapse; width: 100%; }
    blockquote { margin: 1em 0 1em 1.7em; padding-left: 1em;
      border-left: 2px solid #e6e6e6; color: #606060; }
  </style>
</head>
<body>
    {{ paragraphs }}
</body>
</html>
